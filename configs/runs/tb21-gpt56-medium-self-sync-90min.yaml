# GPT-5.6 MEDIUM policy + MEDIUM self-critic: synchronous audited feedback, 90 minutes per agent attempt (2026-09-16).
# .venv/bin/python src/launch.py --spec configs/runs/tb21-gpt56-medium-self-sync-90min.yaml
# Same protocol as tb21-gpt56-self-sync-90min.yaml except the reasoning effort of both roles. No medium no-critic
# baseline exists yet: the frozen baseline is xhigh nocritic.
agent:
  harness: terminus-2
  model: gpt-5.6
  reasoning_effort: medium
  timeout_sec: 5400
  max_turns: -1
critic:
  model: gpt-5.6
  reasoning_effort: medium
  strategy: operator
  tag: sync
benchmark:
  name: tb21
  selection: full
  pass_at_k: 1
run:
  environment: xrlenv
  mode: refresh
  max_workers: 16
  job_id: terminus-2-gpt-5.6-medium-self-critic-medium
