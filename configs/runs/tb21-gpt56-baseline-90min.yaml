# Baseline with the same agent budget as tb21-gpt56-self-sync-90min.yaml.
# .venv/bin/python src/launch.py --spec configs/runs/tb21-gpt56-baseline-90min.yaml
agent:
  harness: terminus-2
  model: gpt-5.6
  reasoning_effort: xhigh
  timeout_sec: 5400
  max_turns: -1
critic:
  enabled: false
benchmark:
  name: tb21
  selection: green
  pass_at_k: 5
run:
  environment: xrlenv
  mode: resume
  max_workers: 16
  job_id: terminus-2-gpt-5.6-xhigh-nocritic-90min
