# Claude Opus 4.8 (medium effort) as the policy, no critic, DeepSWE pass@1 — the no-critic baseline for that model.
# .venv/bin/python src/launch.py --spec configs/runs/deepswe-opus48-medium-baseline.yaml
# Same protocol as the gpt-5.6 baseline (results/deepswe/all/mini-swe-agent-gpt-5.6-nocritic): mini-swe-agent, task-defined
# 5400 s budget, no step limit, 12 workers; only the model / effort differ. Per the job-id convention the effort lives in
# protocol.json, not in the id (a later run at another effort is refused by the resume check unless refreshed).
agent:
  harness: mini-swe-agent
  model: claude-opus-4-8
  reasoning_effort: medium
  max_turns: -1
critic:
  enabled: false
benchmark:
  name: deepswe
  pass_at_k: 1
run:
  environment: xrlenv
  mode: refresh
  max_workers: 12
