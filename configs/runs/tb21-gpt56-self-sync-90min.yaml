# GPT-5.6 xhigh self-critic: synchronous audited feedback, 90 minutes per agent attempt.
# .venv/bin/python src/launch.py --spec configs/runs/tb21-gpt56-self-sync-90min.yaml
# This replaces every task's agent budget; setup/verifier budgets remain task-defined.
agent:
  harness: terminus-2
  model: gpt-5.6
  reasoning_effort: xhigh
  timeout_sec: 5400
  max_turns: -1
critic:
  model: gpt-5.6
  reasoning_effort: xhigh
  strategy: operator
  tag: sync
benchmark:
  name: tb21
  selection: full
  pass_at_k: 1
run:
  environment: xrlenv
  mode: refresh
  max_workers: 16
  job_id: terminus-2-gpt-5.6-xhigh-self-critic
