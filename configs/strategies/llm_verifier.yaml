# Strategy `llm_verifier` — LLM-as-verifier baseline: a 1-20 score of the candidate solution (expectation over the score
# token's log-probabilities when the endpoint returns them); a low score delivers the verifier's "missing" statement.
strategy: llm_verifier
strategy_options:
  min_score: 14                            # scores below this deliver feedback
  score_on: readiness                      # readiness (finish / idle events only) | all (every review point)
  score_from: logprobs                     # logprobs (expected score) | stated (the integer the model wrote)
  top_logprobs: 20                         # top-k log-probabilities requested per token
  min_mass: 0.5                            # minimum probability mass on score tokens to trust the expectation
  carrier_operator: requirement_contract_review   # operator label the feedback is delivered under
applicability:
  intervention_audit: false                # second accept/reject call on every suggestion before delivery
  dedup_window_turns: 6                    # an identical suggestion is not delivered again within this many turns
