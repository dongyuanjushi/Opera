# Strategy `agentic_rubrics` — Agentic Rubrics baseline: a rubric checklist written once per task from the context the
# policy has explored, then execution-free per-item scoring of the candidate; failed items are delivered.
strategy: agentic_rubrics
strategy_options:
  rubric_items: 8                          # maximum number of rubric items
  min_pass: 1.0                            # minimum satisfied fraction of the rubric (failed required items always deliver)
  score_on: readiness                      # readiness (finish / idle events only) | all (every review point)
  carrier_operator: requirement_contract_review   # operator label the feedback is delivered under
applicability:
  intervention_audit: false                # second accept/reject call on every suggestion before delivery
  dedup_window_turns: 6                    # an identical suggestion is not delivered again within this many turns
