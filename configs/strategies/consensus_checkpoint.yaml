# Strategy `consensus_checkpoint` — edit-commit checkpointing against coherence collapse (arXiv:2603.24631):
# a per-conversation ledger of the tracked diffs; once two distinct diffs exist, one call asks whether the current
# diff regressed against the previous checkpoint. Detection only — the finding tells the agent what to restore.
# src/critics/strategies/consensus_checkpoint.py
strategy: consensus_checkpoint
# operators: come from the harness pack (critics/harnesses/<harness>/policy.yaml) — a strategy is harness-agnostic;
#            its carrier_operator falls back to the pack's default_carrier when the set lacks it
strategy_options: {max_checkpoints: 8, carrier_operator: diff_scope_review}
applicability: {intervention_audit: false, dedup_window_turns: 6}
