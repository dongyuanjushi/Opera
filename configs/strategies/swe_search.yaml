# Strategy `swe_search` — SWE-Search's value function (arXiv:2410.20285) judging the LAST executed action on the
# -100..100 scale; rewards below min_value deliver the "alternative branch" feedback to the same trajectory (the
# redirect-in-place adaptation — the paper is a tree search). The reward maps onto the decision's confidence.
# src/critics/strategies/swe_search.py
strategy: swe_search
# operators: come from the harness pack (critics/harnesses/<harness>/policy.yaml) — a strategy is harness-agnostic;
#            its carrier_operator falls back to the pack's default_carrier when the set lacks it
strategy_options: {min_value: 0, carrier_operator: requirement_contract_review}
applicability: {intervention_audit: false, dedup_window_turns: 6}
