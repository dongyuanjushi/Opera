# Strategy `swe_search` — SWE-Search baseline (arXiv:2410.20285): its value function scores the last executed action
# (-100..100); a low score delivers the "alternative branch" feedback to the same trajectory.
strategy: swe_search
strategy_options:
  min_value: 0                             # scores below this deliver feedback; at or above, the action stands
  carrier_operator: requirement_contract_review   # operator label the feedback is delivered under
applicability:
  intervention_audit: false                # second accept/reject call on every suggestion before delivery
  dedup_window_turns: 6                    # an identical suggestion is not delivered again within this many turns
