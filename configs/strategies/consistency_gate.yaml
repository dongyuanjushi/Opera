# Strategy `consistency_gate` — the operator critic, reviewing only when sampled next actions of the policy disagree
# (arXiv:2602.11619).
strategy: consistency_gate
strategy_options:
  samples: 3                               # next-action samples drawn from the policy's endpoint
  trigger_distinct: 2                      # review when at least this many distinct actions appear
  start_turn: 2                            # first turn at which the gate samples
  max_tokens: 160                          # output cap of each sample
  temperature: 1.0                         # sampling temperature of the samples
applicability:
  intervention_audit: true                 # second accept/reject call on every suggestion before delivery
  dedup_window_turns: 6                    # an identical suggestion is not delivered again within this many turns
