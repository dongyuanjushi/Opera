# Strategy `consistency_gate` — behavioural consistency as the uncertainty signal (arXiv:2602.11619): the operator
# critic (same prompt, gates and ledger) reviewing only when `samples` draws of the agent's next action disagree
# (>= trigger_distinct distinct actions). The proxy supplies the agent sampler; without one the gate degrades to
# the configured cadence (the event's trigger kind tells the two apart). src/critics/strategies/consistency_gate.py
strategy: consistency_gate
# operators: come from the harness pack (critics/harnesses/<harness>/policy.yaml) — a strategy is harness-agnostic;
#            its carrier_operator falls back to the pack's default_carrier when the set lacks it
strategy_options: {samples: 3, trigger_distinct: 2, start_turn: 2, max_tokens: 160, temperature: 1.0}
applicability: {intervention_audit: true, dedup_window_turns: 6}
