# Strategy `swe_prm` — SWE-PRM baseline (arXiv:2509.02360): a taxonomy-guided process reward model judging a sliding window
# of recent steps; its guidance is delivered as prose.
strategy: swe_prm
strategy_options:
  feedback_mode: detailed                  # detailed (taxonomy) | simple (no taxonomy) | prescriptive (names the next action)
  window_steps: 8                          # number of most recent agent steps shown to the critic
  carrier_operator: requirement_contract_review   # operator label the prose guidance is delivered under
applicability:
  intervention_audit: false                # second accept/reject call on every suggestion before delivery
  dedup_window_turns: 6                    # an identical suggestion is not delivered again within this many turns
