# opera critic — example configuration (src/critics/config.py: CriticConfig).
#
# Layout: configs/critic/base.yaml (shared schedule / applicability / delivery knobs)
#         configs/critic/<benchmark>.yaml (extends base: endpoint preset, operators, contract, harness)
#         configs/critic-models.yaml (critic model presets, env-only; select with `endpoint: <name>`
#         or `--critic-model <name>`; `endpoint: {preset: <name>, ...}` adds field overrides).
#
# Run as a proxy in front of the agent's LLM endpoint (the harness launchers do this for you):
#   .venv/bin/python -m critics.proxy --config configs/critic/deepswe.yaml --critic-model gpt-5.6 \
#       --upstream http://<host>:30000/v1 --upstream-key-env VLLM_API_KEY --port 8790 --log-dir tmp/critic-logs
#
# This file shows the fully inline form (no presets file needed) for a standalone study.
critic:
  endpoint:
    model: gpt-5.6
    base_url: ${MODEL_RELAY_BASE_URL}/v1        # the critic's own model (independent of the agent's); ${ENV} expands from the shell
    api_key_env: MODEL_RELAY_API_KEY            # var NAME; the value is read at call time, never written to files
    max_tokens: 2048
    token_field: max_completion_tokens          # gpt-5.x style gateways; use max_tokens for vLLM
    temperature: null                            # gpt-5.x accepts only the default temperature; set 0.0 for vLLM/Qwen
    reasoning_effort: medium
    timeout_s: 300
    retries: 4
  operators: swe_repair                         # models.OPERATOR_SETS: swe_repair | evoclaw_v1 (old names swe_repair_v20 / swe_repair_v19 stay loadable as aliases)
  contract: deepswe                             # prompts/contracts/<name>.md — the benchmark's task contract (null = the bare protocol)
  schedule: {start_turn: 3, min_gap: 2, interval: 5, repeat_streak: 3, error_streak: 3, idle_actions: 6, budget_context: false}
  applicability: {intervention_audit: true, dedup_window_turns: 6}
  delivery: {carrier: default}
  max_turns: 200                                # agent step budget when the bridge doesn't pass X-Critic-Max-Turns
  log_dir: tmp/critic-logs
