# Experiment protocol read by experiments/run.py: how each benchmark is launched, which efforts the models run at, the
# Opera critic policy and the ablations. Endpoints and keys come from .env.
defaults:
  max_workers: 12                          # concurrent trials per launch
  pass_at_k: 1                             # attempts per task

# Per benchmark: the src/launch.py arguments.
benchmarks:
  tb21:                                    # Terminal-Bench 2.1
    harness: terminus-2                    # agent scaffold
    selection: green                       # task selection (88 tasks)
    max_workers: 12
    max_turns: null                        # agent turn cap (null = none; the task's wall clock is the budget)
    critic_config: configs/critic/terminal_bench_2_1.yaml   # the benchmark's critic policy
  swebench-pro:                            # SWE-bench Pro
    harness: openhands
    selection: subset-100                  # the 100-task evaluation subset
    max_workers: 12
    max_turns: 150
    critic_config: configs/critic/swebench_pro.yaml
  deepswe:                                 # DeepSWE (113 tasks)
    harness: mini-swe-agent
    extra_flags: ["--reasoning-passback"]  # extra launcher flags: the policy sees its own earlier reasoning
    selection: null                        # the benchmark has a single task set
    max_workers: 12
    max_turns: null
    critic_config: configs/critic/deepswe.yaml

# Opera's critic policy: each override becomes one --critic-policy key=value, `tag` the --critic-tag in the job id.
critic_policy:
  tag: novelty05
  overrides:
    operators: swe_repair                        # operator set
    applicability.readiness_max_novelty: 0.5     # withhold "start implementing" notes while exploration novelty exceeds this
    schedule.idle_max_novelty: 0.5               # an idle stretch triggers a review only when novelty is at or below this

# Reasoning effort of each policy preset per benchmark (`default` = the preset's own default).
agents:
  qwen35-9b:
    reasoning_effort: {tb21: default, swebench-pro: default, deepswe: default}
  muse-glimmer-30b:
    reasoning_effort: {tb21: high, swebench-pro: high, deepswe: high}
  qwen38-27b:
    reasoning_effort: {tb21: xhigh, swebench-pro: medium, deepswe: xhigh}
  deepseek-v4-flash:
    reasoning_effort: {tb21: max, swebench-pro: high, deepswe: max}

# Critic presets and their reasoning effort; `self` = the policy's own preset at the policy's effort.
critics:
  gpt-5.6:
    reasoning_effort: high
  claude-opus-4-8:
    reasoning_effort: high
  self:
    model: agent
    reasoning_effort: agent

# Ablations: critic_policy with these overrides added and its own tag.
ablations:
  edit-only:                               # edit-stage operators only
    tag: novelty05-edit
    overrides: {operators: swe_repair_edit}
  non-edit:                                # all operators except the edit-stage ones
    tag: novelty05-noedit
    overrides: {operators: swe_repair_noedit}
  no-audit:                                # no intervention audit and no close audit
    tag: novelty05-noaudit
    overrides: {applicability.intervention_audit: false}
