# opera critic policy for EvoClaw (milestone-based feature tasks; operator set evoclaw_v1).
# NOTE: the EvoClaw harness (plugins/benchmarks/evoclaw) drives its own agents and is not yet routed through
# critics.proxy — this file is the policy half; wiring its launcher to --critic is a follow-up.
# The evoclaw_v1 operator set renders the generic review protocol (prompts/operator_generic.md); a dedicated
# prompts/contracts/evoclaw.md task contract is the next thing to write once the harness is wired.
extends: base.yaml
strategy: operator
endpoint: gpt-5.6
operators: evoclaw_v1                    # overrides the strategy default (swe_repair)
contract: null                           # no task contract yet; the evoclaw_v1 set renders the generic protocol (prompts/operator_generic.md)
max_turns: 200
