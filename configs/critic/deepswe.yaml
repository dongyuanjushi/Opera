# opera critic for DeepSWE (any scaffold via the proxy).
#   .venv/bin/python src/launch.py deepswe --harness openhands --agent-model qwen36-27b --critic-model gpt-5.6 [--critic-strategy passthrough]
# Three axes: strategy (configs/strategies/*.yaml, default operator), critic model (configs/critic-models.yaml preset,
# default gpt-5.6) and this benchmark policy; the flags override the first two and the job id records all three.
# Only COMMITTED work is graded: the task contract (prompts/contracts/deepswe.md) tells the critic that a submission
# direction must spell out the commit (the container has no git identity).
extends: base.yaml
strategy: operator                         # configs/strategies/operator.yaml; --critic-strategy overrides
endpoint: gpt-5.6
contract: deepswe                            # prompts/contracts/deepswe.md fills the strategy prompt's task-contract slot (committed work only)
max_turns: 200
# Reviews are synchronous (2026-09-16). Reviews every 10 turns instead of the pack's 5 (user decision 2026-09-04):
# the interval reviews mostly restated the requirement contract; halving them lightens the proxy without touching
# the event-driven reviews (completion / stuck / idle).
schedule: {interval: 10}
