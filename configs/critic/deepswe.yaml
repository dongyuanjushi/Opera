# Critic policy for DeepSWE. Schedule, gates and delivery come from the harness pack
# (src/critics/harnesses/<pack>/policy.yaml) and the strategy file; --critic-policy key=value overrides any key for one run.
extends: base.yaml
strategy: operator                         # critic strategy
endpoint: gpt-5.6                          # default critic model preset; --critic-model overrides
contract: deepswe                          # task contract appended to the critic prompt (only committed work is graded)
max_turns: 200                             # agent turn budget the critic assumes
schedule: {interval: 10}                   # review every 10 agent turns (the packs' default is 5)
