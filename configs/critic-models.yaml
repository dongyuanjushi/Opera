# Critic model presets, selected with --critic-model (or `endpoint: <preset>` in configs/critic/<bench>.yaml). No endpoints
# or keys live here: a preset names the environment variables to read (.env). A self-critic run uses the policy's own
# preset name and shares its endpoint.
#
#   model                     id the endpoint serves
#   base_url_env              env vars holding the base URL, first one set wins ("/v1" appended when missing)
#   api_key_env               env vars holding the API key, first one set wins
#   api_key_default           key used when none of api_key_env is set
#   api                       responses | chat (default chat)
#   reasoning_effort          default effort; `none` = the field is not sent (the chat template's default applies)
#   reasoning_effort_choices  efforts --critic-reasoning-effort may pick
#   reasoning_effort_field    where the effort travels: chat_template_kwargs (default: top-level field)
#   reasoning_summary         Responses API: ask for the reasoning summary (auto | concise | detailed)
#   temperature               sampling temperature (null = not sent)
#   max_tokens                output cap of one review (reasoning + decision)
#   token_field               request field carrying the cap (max_tokens | max_completion_tokens)
#   max_input_tokens          review-transcript budget; `auto` = the served window minus max_tokens
#   chars_per_token           chars-per-token estimate used to bound the transcript
#   timeout_s / retries       per-call timeout in seconds / attempts per review
#   response_format           send the decision's strict JSON schema as response_format
#   always_thinking           never retry a review with thinking disabled
#   extra_body                extra fields merged into every request body
presets:
  gpt-5.6:
    model: gpt-5.6
    base_url_env: [MODEL_RELAY_BASE_URL]
    api_key_env: [MODEL_RELAY_API_KEY, RELAY_API_KEY]
    api: responses
    reasoning_summary: detailed
    temperature: null
    reasoning_effort: xhigh
    max_tokens: 16384
    timeout_s: 600
    retries: 4
  gpt-5.5:
    model: gpt-5.5
    base_url_env: [MODEL_RELAY_BASE_URL]
    api_key_env: [MODEL_RELAY_API_KEY, RELAY_API_KEY]
    api: responses
    reasoning_summary: detailed
    temperature: null
    reasoning_effort: medium
    max_tokens: 16384
    timeout_s: 600
    retries: 4
  claude-opus-4-8:
    model: claude-opus-4-8
    base_url_env: [MODEL_RELAY_BASE_URL]
    api_key_env: [MODEL_RELAY_API_KEY, RELAY_API_KEY]
    api: responses
    temperature: null
    reasoning_effort: high
    max_tokens: 16384
    timeout_s: 300
    retries: 4
  claude-opus-5:
    model: claude-opus-5
    base_url_env: [MODEL_RELAY_BASE_URL]
    api_key_env: [MODEL_RELAY_API_KEY, RELAY_API_KEY]
    api: responses
    temperature: null
    max_tokens: 4096
    timeout_s: 300
    retries: 4
  claude-sonnet-5:
    model: claude-sonnet-5
    base_url_env: [MODEL_RELAY_BASE_URL]
    api_key_env: [MODEL_RELAY_API_KEY, RELAY_API_KEY]
    api: responses
    temperature: null
    max_tokens: 4096
    timeout_s: 300
    retries: 4
  qwen38-27b:
    max_input_tokens: auto
    chars_per_token: 2.4
    model: Qwen3.8-27B
    base_url_env: [QWEN38_27B_BASE_URL, VLLM_BASE_URL]
    api_key_default: dummy
    token_field: max_tokens
    temperature: 0.0
    reasoning_effort: medium
    reasoning_effort_choices: [medium, xhigh]
    reasoning_effort_field: chat_template_kwargs
    max_tokens: 16384
    timeout_s: 600
    retries: 3
  qwen36-27b:
    max_input_tokens: auto
    chars_per_token: 2.4
    model: Qwen3.6-27B
    base_url_env: [QWEN36_27B_BASE_URL, VLLM_BASE_URL]
    api_key_default: dummy
    token_field: max_tokens
    temperature: 0.0
    reasoning_effort: none
    max_tokens: 16384
    timeout_s: 600
    retries: 3
  qwen35-9b:
    max_input_tokens: auto
    chars_per_token: 2.4
    model: Qwen3.5-9B
    base_url_env: [QWEN35_9B_BASE_URL, VLLM_BASE_URL]
    api_key_default: dummy
    token_field: max_tokens
    temperature: 0.0
    reasoning_effort: none
    max_tokens: 16384
    timeout_s: 600
    retries: 3
  sft-critic:                    # a locally trained checkpoint (src/sft), served under the id sft-critic
    max_input_tokens: auto
    chars_per_token: 2.4
    model: sft-critic
    base_url_env: [SFT_CRITIC_BASE_URL, VLLM_BASE_URL]
    api_key_env: [VLLM_API_KEY]
    api_key_default: dummy
    token_field: max_tokens
    temperature: 0.0
    reasoning_effort: none
    max_tokens: 16384
    timeout_s: 600
    retries: 3
  muse-glimmer-30b:
    max_input_tokens: auto
    chars_per_token: 2.4
    model: muse-glimmer-30b
    base_url_env: [MUSE_GLIMMER_30B_BASE_URL, VLLM_BASE_URL]
    api_key_env: [VLLM_API_KEY]
    api_key_default: dummy
    token_field: max_tokens
    temperature: 0.0
    reasoning_effort: none
    max_tokens: 16384
    timeout_s: 600
    retries: 3
  deepseek-v4-flash:
    max_input_tokens: auto
    chars_per_token: 2.4
    model: DeepSeek-V4-Flash-0731
    response_format: true
    always_thinking: true
    extra_body:
      include_reasoning: true
      chat_template_kwargs: {thinking: true, enable_thinking: true}
    base_url_env: [DEEPSEEK_V4_FLASH_BASE_URL, VLLM_BASE_URL]
    api_key_default: dummy
    token_field: max_tokens
    temperature: 1.0
    reasoning_effort: max
    reasoning_effort_choices: [low, high, max]
    reasoning_effort_field: chat_template_kwargs
    max_tokens: 16384
    timeout_s: 600
    retries: 3
  ornith15-35b-a3b:
    model: Ornith-1.5-35b-a3b
    base_url_env: [ORNITH15_35B_A3B_BASE_URL, VLLM_BASE_URL]
