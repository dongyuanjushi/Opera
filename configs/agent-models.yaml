# Model presets for every benchmark example runner (DeepSWE, SWE-bench Pro, …). NO endpoints or keys live here: every preset
# names the environment variables to read (export them in ~/.bashrc / the shell).
#
#   qwen*   — vLLM served on a GPU node (launch_scripts/vllm/qwen/*.sh: router on :30000);
#             base URL from the preset-specific var, else the shared VLLM_BASE_URL.
#   gpt-5.6, claude-opus-4-8 — the model relay: MODEL_RELAY_BASE_URL + MODEL_RELAY_API_KEY (RELAY_API_KEY);
#             `model` is the id the relay serves (claude-opus-4-8, NOT claude-opus-4.8 — verified against its allow-list).
#
# `model` is the served / relay model id; the scaffold decides the LiteLLM prefix:
#   mini-swe-agent -> openai/<model> (chat completions against OPENAI_BASE_URL)
#   openhands      -> hosted_vllm/<model> for vLLM, openai/<model> for the relay
#
# reasoning_effort (src/critics/config.py: resolve_reasoning_effort):
#   none      — the field is NOT sent; the model's chat-template default applies (thinking on for
#               Qwen3.5 / Qwen3.6 / Ornith). A literal "none" is never sent: vLLM would map it to
#               enable_thinking=false and silently switch thinking off.
#   <value>   — the default to send: qwen38-27b medium (its template takes exactly the
#               reasoning_effort_choices low | medium | xhigh, own default xhigh; --reasoning-effort
#               picks another one and the job id carries it: deepswe-openhands-qwen38-27b-low-pass4,
#               so efforts never share a job), gpt-5.6 medium (the relay's requirement).
#   required  — no default: the run must pick one of reasoning_effort_choices with --reasoning-effort.
# On the wire: vLLM presets carry it in extra_body (LiteLLM's openai/ provider rejects the top-level
# field for non-OpenAI model ids; the OpenAI client merges extra_body into the same JSON body), the
# relay preset keeps the fork's verified top-level path.
presets:
  qwen35-9b:
    model: Qwen3.5-9B
    kind: vllm
    # OpenHands reasoning re-injection (launcher default since 2026-09-23) stays OFF for this preset: every recorded 9B OpenHands
    # run and the SFT data built from them never showed the model its earlier thinking; keep the 9B's context identical to them.
    # (Passback on mini / Terminus 2 is a no-op for the stock Qwen3 template, which strips history thinking after a user turn.)
    reasoning_reinject: false
    base_url_env: [QWEN35_9B_BASE_URL, VLLM_BASE_URL]
    api_key_env: [VLLM_API_KEY]
    api_key_default: dummy
    reasoning_effort: none
    # No per-call output cap (2026-09-19 user decision; a 16384 cap was pinned 2026-09-17): the model may think and
    # answer up to the end of the served window. --sampling-max-tokens N re-imposes a cap for one run.
  sft-critic:                                # a locally trained checkpoint (src/sft) served with --served-model-name sft-critic;
                                             # export SFT_CRITIC_BASE_URL. As an AGENT preset it lets the same checkpoint be
                                             # evaluated as the policy (alone, or self-critiquing) — src/sft/pipeline/eval_checkpoint.py.
    model: sft-critic
    kind: vllm
    base_url_env: [SFT_CRITIC_BASE_URL, VLLM_BASE_URL]
    api_key_env: [VLLM_API_KEY]
    api_key_default: dummy
    reasoning_effort: none
  deepseek-v4-flash:                         # DeepSeek-V4-Flash-0731 served by launch_scripts/vllm/deepseek/deepseek-v4-flash-0731.sh (TP=8, router in front)
    model: DeepSeek-V4-Flash-0731            # served id; must match /v1/models (a build served as DeepSeek-V4-Flash, without the
                                             # suffix, ran briefly on 2026-09-17). 262144-token context INCLUDING the output
    kind: vllm
    base_url_env: [DEEPSEEK_V4_FLASH_BASE_URL, VLLM_BASE_URL]
    api_key_env: [VLLM_API_KEY]
    api_key_default: dummy                   # the router is unauthenticated
    # Thinking is on by default (the launcher's --default-chat-template-kwargs {"thinking": true, "reasoning_effort": "high"});
    # the native deepseek_v4 encoding takes exactly low | high | max (vllm/tokenizers/deepseek_v4_encoding.py; there is no
    # medium). The thinking comes back in a `reasoning` field (not reasoning_content; probe 2026-09-09), the content is the
    # clean answer, native tool calls work. Effort travels as chat_template_kwargs.reasoning_effort like Qwen3.8's (the
    # vllm-router's top-level enum would reject `max`). Sampling is pinned below (it was unpinned until 2026-09-17).
    reasoning_effort: max                    # user decision 2026-09-09: max by default, thinking still enabled
    # DeepSeek's own guidance for local deployment (user, 2026-09-17): temperature 1.0 with top_p 0.95 for agentic
    # scenarios (top_p 1.0 otherwise). Before this the preset pinned nothing and the served generation_config defaults
    # applied; the 2026-09-17 subset-100 run under those defaults broke on tool-call formatting in 99/100 trials.
    sampling: {temperature: 1.0, top_p: 0.95}   # no per-call output cap since 2026-09-19 (see qwen35-9b)
    # OpenHands only. DeepSeek writes a malformed native tool call in ~1.3 % of its replies (56/4221 on 2026-09-18);
    # the SDK treats any reply without a tool call as the final answer, so over a 20-100-reply episode 56 % of
    # subset-100 trials ended there, while Terminus 2 (JSON in text, parse errors fed back) lost none. The runner
    # re-prompts such an ending instead of stopping, up to N times in a row. Tried and dropped on 2026-09-19:
    # prompt-described tools (`openhands_native_tool_calling: false`) — the XML call format is close enough to DSML
    # that the per-reply failure rate rose to 12.5 %, and the text repair (`openhands_tool_text_repair: deepseek`)
    # recovered 1/29 tasks where native calls pass 27/29. Both switches remain available; neither is set here.
    openhands_retry_malformed_calls: 3
    reasoning_effort_choices: [low, high, max]
    reasoning_effort_field: chat_template_kwargs
  muse-glimmer-30b:                          # self-hosted vLLM (user-launched 2026-09-01); served id muse-glimmer-30b, 131072 ctx
    model: muse-glimmer-30b
    kind: vllm
    base_url_env: [MUSE_GLIMMER_30B_BASE_URL, VLLM_BASE_URL]
    api_key_env: [VLLM_API_KEY]
    api_key_default: dummy
    # Effort (2026-09-23): the template reads the chat_template kwarg `reasoning_strength` (low | medium | high | xhigh) and
    # writes "Reasoning strength: <x>." into the system prompt, defaulting to high when the kwarg is absent — which is what
    # every Muse run before 2026-09-23 got, since the launcher sent an OpenAI-style top-level reasoning_effort the template
    # ignores. Now sent explicitly as chat_template_kwargs.reasoning_strength (the vllm-router passes it through).
    # probe 2026-09-01: an always-on thinking model — reasoning comes back in a `reasoning` field, content is clean, native
    # tool calls work; the template's enable_thinking kwarg is inert.
    reasoning_effort: high
    reasoning_effort_choices: [low, medium, high, xhigh]
    reasoning_effort_field: chat_template_kwargs
    reasoning_effort_key: reasoning_strength
    # no per-call output cap since 2026-09-19 (see qwen35-9b); sampling otherwise stays at the served defaults
  qwen36-27b:
    model: Qwen3.6-27B
    kind: vllm
    base_url_env: [QWEN36_27B_BASE_URL, VLLM_BASE_URL]
    api_key_env: [VLLM_API_KEY]
    api_key_default: dummy
    reasoning_effort: none               # Qwen3.6's template has no effort levels (thinking on by default)
    # The model card's Terminal-Bench 2.0 protocol: Harbor/Terminus-2, temp=1.0, top_p=0.95, top_k=20, max_tokens=80K,
    # 256K ctx, 3 h timeout, 32 CPU / 48 GB, avg of 5. Sampling is sent explicitly (it equals the served
    # generation_config defaults; top_k / max_tokens ride in extra_body / LiteLLM's max_tokens). Its template keeps
    # reasoning only after the last user turn (stock Qwen3), so no interleaved_thinking.
    # max_tokens: the card says 80K. History: 81920 (Terminus 2 / mini) until 2026-09-17, then 16384 per call, then no
    # cap at all since 2026-09-19 (user decision) — a turn may think to the end of the served window.
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 20}   # no per-call output cap since 2026-09-19 (see qwen35-9b)
  qwen38-27b:
    model: Qwen3.8-27B
    kind: vllm
    base_url_env: [QWEN38_27B_BASE_URL, VLLM_BASE_URL]
    api_key_env: [VLLM_API_KEY]
    api_key_default: dummy
    reasoning_effort: medium             # Qwen3.8 chat template: low | medium | xhigh only (anything else is a 400); --reasoning-effort overrides.
                                         # medium by default since 2026-09-06 (user decision; xhigh was the default 2026-08-26 … 09-05): on DeepSWE
                                         # xhigh thought 2.2x longer per step and timed out 12 % of attempts; the critic preset is medium as well
    reasoning_effort_choices: [low, medium, xhigh]
    # The vllm-router (0.1.15) in front of the stack deserializes requests into a typed struct whose reasoning_effort
    # enum stops at `high` -> a top-level `xhigh` is a 422 before vLLM sees it. chat_template_kwargs.reasoning_effort is
    # what the template reads anyway and passes the router untouched.
    reasoning_effort_field: chat_template_kwargs
    # Qwen3.8's template keeps <think> blocks for every past assistant turn unless preserve_thinking=false, so the model
    # expects its own reasoning_content back in the history (harbor's Terminus 2 drops it unless interleaved_thinking).
    # Its recommended thinking-mode sampling (T=1.0 / top_p=0.95 / top_k=20) equals the served default; sent explicitly anyway.
    interleaved_thinking: true
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 20}   # no per-call output cap since 2026-09-19 (see qwen35-9b)

  ornith15-35b-a3b:                      # Ornith-1.5-35b-a3b (MoE, 3B active) served by launch_scripts/vllm/ornith/ornith15-35b-a3b.sh (4 endpoints × TP=2, router :30000)
    model: Ornith-1.5-35b-a3b
    kind: vllm
    base_url_env: [ORNITH15_35B_A3B_BASE_URL, VLLM_BASE_URL]
    api_key_env: [VLLM_API_KEY]
    api_key_default: dummy
    reasoning_effort: none               # Qwen3.5-style template: enable_thinking only
    # The model card's Terminal-Bench 2.1 (Terminus-2) protocol (2026-08-28): parser=json, temperature=1.0, top_p=1.0, a
    # 128K context window, Harbor keeping reasoning_content in the history (its adjusted chat template re-inserts
    # <think>…</think> for EVERY past assistant turn, so a history without it is a train/inference mismatch). Served
    # sampling defaults (generation_config.json) are T=1.0 / top_p=0.95 / top_k=20 — the card's top_p=1.0 is sent explicitly.
    interleaved_thinking: true           # Terminus 2 ctor kwarg (harbor default False)
    sampling: {temperature: 1.0, top_p: 1.0}
    context_window: 131072               # the card's 128K window (the served max_model_len is 262144; --context-window overrides)
  # Relay models (gpt-5.6, claude-opus-4-8) run on the Responses API only (user decision 2026-09-02): `api: responses`.
  # Terminus 2 uses harbor's use_responses_api (stateless, the full item history every call — the relay's ZDR org
  # rejects previous_response_id), mini-swe-agent its litellm_response model, the OpenHands SDK its native Responses
  # path (openai/ provider). The chat-completions recipes of the relay era (tool_call_only, chat_completions_only,
  # openhands_provider) are gone with the transport.
  claude-opus-4-8:                       # Claude Opus 4.8 through the relay
    model: claude-opus-4-8
    kind: relay
    api: chat                            # chat completions, NOT the Responses API (see below)
    base_url_env: [MODEL_RELAY_BASE_URL]
    api_key_env: [MODEL_RELAY_API_KEY, RELAY_API_KEY]
    # Reasoning (probed 2026-09-09 with unique prompts): the relay serves this model from Bedrock / Vertex through
    # LiteLLM. On /v1/responses it returns NO reasoning items (nothing to carry over); on /v1/chat/completions with
    # `thinking: {type: adaptive}` every reply carries one SIGNED `thinking` block (text stripped, signature kept) that
    # the relay accepts back in the assistant message — and that block restores the model's private reasoning on the
    # next turn (secret-number test: recalled 4/4 with the block, denied 3/4 without). That is claude's equivalent of
    # gpt-5.x's encrypted reasoning items, so the agent role runs on chat with:
    #   thinking: adaptive                    -> extra_body.thinking = {type: adaptive} on every call
    #   reasoning_effort_field: output_config -> extra_body.output_config = {effort: <level>} (the OpenAI-style
    #                                            reasoning_effort field yields no block on this path)
    #   thinking_carryover: true              -> mini-swe-agent and the OpenHands SDK store + resend thinking_blocks
    #                                            natively; Terminus 2 uses plugins.terminus2_scaffold.llm.ThinkingChatLLM
    # The block appears only on turns where adaptive thinking actually ran (a trivial reply carries none) and only with
    # max_tokens unset or >= 2048 (1024 and 512 returned no block) — the harnesses send none, so leave it that way.
    # `thinking.type=enabled` is rejected ("use adaptive and output_config.effort"); temperature must NOT be sent
    # ('does not support temperature=0. Only temperature=1'). The critic preset (configs/critic-models.yaml) stays on
    # the Responses API — a review is one call and needs no carry-over.
    thinking: adaptive
    reasoning_effort_field: output_config
    reasoning_effort: high               # low | medium | high; `max` hit the relay's ~125 s edge timeout (HTTP 524) on hard
    reasoning_effort_choices: [low, medium, high]   # steps and `xhigh` is not a claude level; --reasoning-effort overrides
    thinking_carryover: true
  gpt-5.6:
    model: gpt-5.6
    kind: relay
    api: responses                       # /v1/responses — the leaderboard's OpenAI-direct GPT-5.x protocol; served by the relay
                                         # since 2026-08-27, reviewed by the critic proxy since 2026-08-29
    base_url_env: [MODEL_RELAY_BASE_URL]
    api_key_env: [MODEL_RELAY_API_KEY, RELAY_API_KEY]
    reasoning_effort: xhigh              # an explicit effort is required on the relay; --reasoning-effort picks another (the job id carries it)
    reasoning_carryover: true            # encrypted reasoning items re-sent every turn (Terminus 2: ReasoningResponsesLLM; OpenHands / mini: native)
  gpt-5.6-chat:                        # A/B arm (2026-09-16): gpt-5.6 through the relay's /v1/chat/completions instead of
    model: gpt-5.6                       # /v1/responses — same model, same relay, top-level reasoning_effort, NO reasoning
    kind: relay                          # carry-over between turns (chat completions return no reasoning items for gpt-5.x).
    api: chat                            # Compare against the gpt-5.6 preset under an otherwise identical launch.
    base_url_env: [MODEL_RELAY_BASE_URL]
    api_key_env: [MODEL_RELAY_API_KEY, RELAY_API_KEY]
    reasoning_effort: medium
    reasoning_carryover: false
    openhands_provider: hosted_vllm      # the SDK picks Responses for openai/gpt-5.x ids; hosted_vllm/ keeps it on chat
  gpt-5.5:                             # relay id gpt-5.5 (allow-listed 2026-09-08); same transport and knobs as gpt-5.6
    model: gpt-5.5
    kind: relay
    api: responses                       # /v1/responses — the leaderboard's OpenAI-direct GPT-5.x protocol; served by the relay
                                         # since 2026-08-27, reviewed by the critic proxy since 2026-08-29
    base_url_env: [MODEL_RELAY_BASE_URL]
    api_key_env: [MODEL_RELAY_API_KEY, RELAY_API_KEY]
    reasoning_effort: xhigh              # parity with the gpt-5.6 agent protocol (leaderboard effort); accepts low|medium|high|xhigh on the relay (probed 2026-09-09)
    reasoning_carryover: true            # encrypted reasoning items re-sent every turn (Terminus 2: ReasoningResponsesLLM; OpenHands / mini: native)
